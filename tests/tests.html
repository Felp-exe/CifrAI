<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes · CifrAI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; }
    #summary { font-size: 1.3rem; font-weight: 700; padding: 12px 16px; border-radius: 10px; background: #f1f5f9; }
    #summary.pass { background: #dcfce7; color: #166534; }
    #summary.fail { background: #fee2e2; color: #991b1b; }
    ul { list-style: none; padding: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: .95rem; }
    li.pass { color: #166534; }
    li.fail { color: #991b1b; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Testes automáticos</h1>
  <p>Abra esta página por <code>http://localhost:8080/tests/tests.html</code>.</p>
  <div id="summary">Executando…</div>
  <ul id="results"></ul>
  <script type="module">
    import { runAll } from './runner.js';
    import './format.test.js';
    import './db.test.js';
    import './import.test.js';
    import './categorization.test.js';
    import './budget.test.js';
    import './cycles.test.js';
    import './dashboard.test.js';
    import './agent.test.js';
    import './backup.test.js';
    import './views.test.js';
    import './limpeza.test.js';
    import './regras-genericas.test.js';
    import './seguranca.test.js';
    runAll(document.getElementById('results'), document.getElementById('summary'));
  </script>
</body>
</html>
