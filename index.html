<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Regra de segurança (CSP): a página só carrega e executa código DESTE site. Scripts, estilos, imagens, fontes,
       workers e conexões de outros endereços são bloqueados; plugins (object) e <base> também. Estilos inline
       continuam permitidos porque o app usa cores por atributo style (não executam código).
       Para conectar um backend de IA, acrescente o endereço dele em connect-src (veja docs/CONFIGURAR-LLM.md). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CifrAI: controle financeiro pessoal a partir do extrato em PDF, com categorias, orçamentos, gráficos e assistente. Seus dados ficam no seu navegador.">
  <meta name="color-scheme" content="light dark">
  <title>CifrAI · Controle financeiro pessoal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235846b8'/%3E%3Cpath d='M9 21l5-6 4 4 6-8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript><p class="banner">O CifrAI precisa de JavaScript ativado no navegador para funcionar.</p></noscript>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>

  <aside class="sidebar">
    <a class="brand" href="#/inicio" aria-label="CifrAI: ir para a tela inicial">
      <span class="brand-logo" aria-hidden="true"></span>
      <div><strong>Cifr<em>AI</em></strong><span>Finanças pessoais</span></div>
    </a>
    <nav id="nav" class="nav" aria-label="Navegação principal"></nav>
    <p class="privacy-note">Seus dados ficam apenas neste navegador.</p>
  </aside>

  <div class="content">
    <a class="mobile-brand" href="#/inicio" aria-label="CifrAI: ir para a tela inicial">
      <span class="brand-logo" aria-hidden="true"></span><span>Cifr<em>AI</em></span>
    </a>
    <div id="banner" class="banner" hidden>
      Você abriu o arquivo direto do computador. Para o app funcionar corretamente, abra pelo endereço
      <strong>http://localhost:8080</strong> (veja o arquivo <em>iniciar.bat</em>).
    </div>
    <div id="app-error" class="banner error" role="alert" hidden>
      <span></span> <button id="app-error-close" class="btn small" type="button">Fechar</button>
    </div>
    <main id="view" tabindex="-1">
      <p class="loading">Carregando…</p>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
